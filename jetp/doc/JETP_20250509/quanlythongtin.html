<!DOCTYPE html>
<html lang="vn">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ - JETP</title>
    <meta name="Keywords" content="Trang chủ - JETP,JETP" />
    <meta name="Description" content="JETP" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="images/icon-logo.png" type="image/x-icon" />

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/swiper-bundle.min.css"/>

</head>
<body>
    <div class="section-manage">
        <div class="manage-head">
            <div class="mw-01 manage-head-left"><a href="#"><img src="images/logo2025.png" alt="JETP Viet Nam"></a></div>
            <div class="mw-02 manage-head-right">
                <div class="ava-user">
                    <div class="ava-img"><img src="images/img.jpg" alt=""></div>
                    <p>Nguyễn Văn A</p>
                </div>
            </div>
        </div>
        <div class="manage-body">
            <div class="manage-bnr">
                <img src="images/manage-bnr.jpg" alt="">
                <div class="manage-title">
                    <ul>
                        <li class="active">Quản lý thông tin</li>
                        <li><a href="doimatkhau.html">Đổi mật khẩu</a></li>
                    </ul>
                </div>
            </div>
            <div class="manage-content">
                <div class="mw-01 manage-sidebar">
                    <div class="">
                        <ul class="manage-menu-list mt30">
                            <li class="active"><a href="#"><span class="icon-user m-icon"></span><span class="menu-txt">Thông tin tài khoản</span></a></li>
                            <li><a href="#"><span class="icon-project m-icon"></span><span class="menu-txt">Gửi đề xuất dự án</span></a></li>
                            <li><a href="#"><span class="icon-folder m-icon"></span><span class="menu-txt">Quản lý dự án</span></a></li>
                        </ul>
                    </div>
                </div>
                <div class="mw-02 manage-main">
                    <div class="manage-wrap mt50">
                        <div class="m-form">
                            <div class="m-form-item w-50">
                                <label>Tên <span class="textred">*</span></label>
                                <input type="text" placeholder="Văn A">
                            </div>
                            <div class="m-form-item w-50">
                                <label>Họ <span class="textred">*</span></label>
                                <input type="text" placeholder="Nguyễn">
                            </div>
                            <div class="m-form-item">
                                <label>E-mail  <span class="textred">*</span></label>
                                <input type="text" placeholder="NVA@gmail.com">
                            </div>
                            <div class="m-form-item">
                                <label>Số điện thoại <span class="textred">*</span></label>
                                <input type="text" placeholder="099 123 4567">
                            </div>
                            <div class="m-form-item">
                                <label>Tổ chức  <span class="textred">*</span></label>
                                <input type="text" placeholder="Tập doàn Điện lực Việt Nam">
                            </div>
                        </div>
                        <div class="text-center mt20 w-100">
                            <a href="#" class="btn-blue btn-cm">Cập nhật</a>
                        </div>
                    </div>
                </div>
                <div class="m-log-out">
                    <img src="images/manage-img.png" alt="">
                    <a href="#" class="btn-log-out"><img src="images/icon-log-out.png" alt=""> Đăng xuất</a>
                </div>
            </div>
        </div>
    </div>

<!-- JS --->
<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.min.js"></script>

<script src="js/jquery.matchHeight.js" type="text/javascript"></script>
<script src="js/swiper-bundle.min.js"></script>
<script src="js/script.js" type="text/javascript"></script>

</body>
</html>
