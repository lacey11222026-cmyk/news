<!DOCTYPE html>
<html lang="vn">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ - JETP</title>
    <meta name="Keywords" content="Trang chủ - JETP,JETP" />
    <meta name="Description" content="JETP" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="images/icon-logo.png" type="image/x-icon" />

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/swiper-bundle.min.css"/>

</head>
<body>
    <section class="section-login-1" style="background-image: url('images/bg-dangky.jpg');">
        <div class="container-fulid" style="height: inherit;">
            <div class="content">
                <div class="col-left">
                    <div class="header-login">
                        <div class="logo">
                            <a href="#">                                                            
                               <img src="images/logo.png" alt="images">
                            </a>
                        </div>
                        <div class="lang">
                            <button class="bnt-lang">
                                <img src="images/vn.png" alt="images">         <span>Tiếng Việt</span>
                                <i class="fas fa-caret-down"></i>
                            </button>
                            <ul class="list-lang">
                                <li><a href="#"><img src="images/gb.png" alt="images"><span>English</span></a></li><li><a href="#"><img src="images/vn.png" alt="images"><span>Tiếng Việt</span></a></li>            </ul>
                        </div>
                    </div>
                </div>                                
                <div class="col-right">
                    <div class="right-form ">
                        <div class="title">
                            <h2>Tạo tài khoản</h2>
                            <p>Chào mừng bạn đến <strong>Quan hệ đối tác chuyển đổi năng lượng công bằng (JETP)</strong> Trang đăng nhập. Đăng nhập để tham gia.</p>
                        </div>
                        <form action="" class="form-register">
                            <input type="hidden" name="csrfToken" value="86bd02aa27">
                            <div class="account-info">
                                <div class="f-item fw-100">
                                    <div class="f-col">
                                        <label for="">Tên tài khoản*</label>
                                        <input type="text" name="username" id="username" placeholder="Nhập tài khoản email của bạn" class="input-cm">
                                        <label class="username-error error" for="username"></label>
                                    </div>
                                </div>
                                <div class="f-item fw-100">
                                    <div class="f-col">
                                        <label for="">Mật khẩu*</label>
                                        <input type="password" name="password" id="password" placeholder="Nhập mật khẩu của bạn" class="input-cm">
                                        <label class="password-error error" for="password"></label>
                                    </div>
                                </div>
                                <div class="f-item fw-100">
                                    <div class="f-col">
                                        <label for="">Xác nhận *</label>
                                        <input type="password" name="repassword" id="repassword" placeholder="Nhập lại mật khẩu của bạn" class="input-cm">
                                        <label class="repassword-error error" for="repassword"></label>
                                    </div>
                                </div>
                                <div class="step">
                                    <div class="step-left">
                                        <strong>(Bước 2/2)</strong>
                                        <div class="dot-step step-v2">
                                            <span class="dot step-1"></span>
                                            <span class="dot step-2"></span>
                                        </div>
                                    </div>
                                    <div class="step-right">
                                        <a href="javascript:void(0)" class="back-to-basic-info">
                                            <i class="fa fa-undo" aria-hidden="true"></i>
                                            <span>Quay lại</span>
                                        </a>
                                    </div>
                                </div>
                                <div class="note note-v2">
                                    <input type="checkbox" name="commit" id="commit">
                                    <label for="commit">Bằng việc đăng nhập, tôi đồng ý với JETP Việt Nam <a href="#">Điều khoản sử dụng</a> Và <a href="#">Chính sách bảo mật</a></label>
                                </div>
                                <button type="submit" class="btn-cm btn-blue w-100"><span>Tiếp theo</span></button>
                                <div class="my-account">
                                    <p>Bạn đã có tài khoản chưa? <a href="http://jetp.wecan-group.info/vi/dang-nhap/">Đăng nhập ngay</a></p>
                                </div>
                                <label class="commit-error error" for="commit"></label>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

<!-- JS --->
<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.min.js"></script>

<script src="js/jquery.matchHeight.js" type="text/javascript"></script>
<script src="js/swiper-bundle.min.js"></script>
<script src="js/script.js" type="text/javascript"></script>

</body>
</html>
