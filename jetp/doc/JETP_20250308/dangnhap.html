<!DOCTYPE html>

<head>

<body>
    <section class="section-login-1" style="background-image: url('images/bg-dangnhap.jpg');">
        <div class="container-fulid" style="height: inherit;">
            <div class="content">
                <div class="col-left">
                    <div class="header-login">
                        <div class="logo">
                            <a href="#">                                                            
                               <img src="images/logo.png" alt="images">
                            </a>
                        </div>
                        <div class="lang">
                            <button class="bnt-lang">
                                <img src="images/vn.png" alt="images">         
                                <span>Tiếng Việt</span>
                                <i class="fas fa-caret-down"></i>
                            </button>
                            <ul class="list-lang">
                                <li><a href="#"><img src="images/gb.png" alt="images"><span>English</span></a></li><li><a href="#"><img src="images/vn.png" alt="images"><span>Tiếng Việt</span></a></li>            
                            </ul>
                        </div>
                    </div>
                </div>                                
                <div class="col-right">                                    
                    <div class="right-form">                                        
                        <div class="title">
                            <h2>Đăng nhập</h2>
                            <p>Chào mừng bạn đến <br><strong>Quan hệ đối tác chuyển đổi năng lượng công bằng (JETP)</strong> Trang đăng nhập. Đăng nhập để tham gia.</p>
                        </div>
                        <form action="" id="form-login" novalidate="novalidate">
                            <input type="hidden" name="csrfToken" value="c9b0d85b04">
                            <div class="f-col">
                                <label for="">Tên tài khoản</label>
                                <input type="text" name="username" id="username" placeholder="Nhập tên người dùng của bạn" class="input-cm">
                            </div>
                            <div class="f-col">
                                <label for="">Mật khẩu</label>
                                <input type="password" name="password" id="password" placeholder="Nhập mật khẩu của bạn" class="input-cm">
                            </div>
                            <a href="#" class="repass">Quên mật khẩu?</a>
                            <div class="note">
                                <p>Bằng việc đăng nhập, tôi đồng ý với JETP Việt Nam <a href="#">Điều khoản sử dụng</a> Và <a href="#">Chính sách bảo mật</a></p>
                            </div>
                            <button class="btn-cm btn-blue w-100"><span>Đăng nhập</span></button>
                            <div class="bnt-more mt10">
                                <p>Chưa có tài khoản? <a href="http://jetp.wecan-group.info/vi/dang-ky/">Tạo tài khoản</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
